name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test digest verification (Pester)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester)) { Install-Module Pester -Force -Scope CurrentUser }
          Invoke-Pester -Path tools/tests -CI

      - name: Fetch xray engine (pinned, digest-verified)
        run: powershell -ExecutionPolicy Bypass -File tools/fetch-assets.ps1 -XrayVersion v26.3.27

      - name: Build main app
        run: dotnet build Akiroute/Akiroute.csproj -c Release

      - name: Run tests
        run: dotnet test Akiroute.Tests/Akiroute.Tests.csproj -c Release --logger "console;verbosity=normal"
